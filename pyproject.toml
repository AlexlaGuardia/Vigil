[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-agent"
version = "2.3.0"
description = "Cognitive infrastructure for AI agents — awareness daemon, frame-based tool filtering, signal protocol, session handoff, and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex LaGuardia", email = "alex@alexlaguardia.dev" }
]
keywords = ["ai", "agents", "mcp", "awareness", "cognitive", "llm", "tools", "handoff", "compaction"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/AlexlaGuardia/Vigil"
Repository = "https://github.com/AlexlaGuardia/Vigil"
Issues = "https://github.com/AlexlaGuardia/Vigil/issues"

[project.scripts]
vigil = "vigil.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
server = ["mcp>=1.0.0", "fastapi>=0.100.0", "uvicorn>=0.20.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "anyio>=4.0"]
# Everything the full test suite imports (core + server + hosted tiers), so CI
# can `pip install -e ".[test]"` and run green without guessing transitive deps.
test = [
    "pytest>=7.0", "pytest-asyncio>=0.21", "anyio>=4.0",
    "fastapi>=0.100.0", "uvicorn>=0.20.0", "mcp>=1.0.0",
    "httpx>=0.24", "itsdangerous>=2.0", "pydantic>=2.0", "stripe>=5.0",
]

[tool.hatch.build]
include = ["vigil/**", "completions/**", "examples/**"]

[tool.hatch.build.targets.wheel]
packages = ["vigil"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
